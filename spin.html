<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Spinning</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg:        #0d0d0d;
  --panel:     #1a1a1a;
  --surface:   #242424;
  --border:    #2e2e2e;
  --text:      #ffffff;
  --text-sec:  #888888;
  --text-muted:#444444;
  --accent:    #00BFA5;
  --accent-dim:#00594d;
  --z1: #6b6b6b;
  --z2: #4a90d9;
  --z3: #4caf50;
  --z4: #ff9800;
  --z5: #f44336;
  --current-zone: #6b6b6b;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; overflow:hidden; }

.btn {
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.04em;
  border:none;
  border-radius:var(--radius-sm);
  cursor:pointer;
  padding:10px 16px;
  transition:background 0.2s, color 0.2s, opacity 0.2s;
  white-space:nowrap;
  user-select:none;
}
.btn-primary { background:var(--accent); color:#000; }
.btn-primary:active { opacity:0.8; }
.btn-secondary { background:var(--surface); color:var(--text-sec); border:1px solid var(--border); }
.btn-secondary:active { background:var(--border); }
.btn-secondary.active { border-color:var(--accent); color:var(--accent); }
.btn-ghost { background:transparent; color:var(--text-muted); border:1px solid var(--border); }
.btn-ghost:active { background:var(--surface); }


/* ── TOP BAR ── */
.top-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.top-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.top-row .btn { flex: 1; text-align: center; padding: 9px 8px; font-size: 12px; }

.back-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 20px;
  cursor: pointer;
  padding: 4px 8px 4px 0;
  line-height: 1;
  flex-shrink: 0;
}

/* ── STATUS DOTS ── */
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 5px;
  background: var(--text-muted);
  transition: background 0.3s;
  vertical-align: middle;
}
.status-dot.connected { background: var(--accent); }

/* ── PANELS (60% height) ── */
.panels-wrap {
  display: flex;
  flex-direction: column;
  height: calc(100dvh - 90px);
  padding: 8px 8px 0;
  gap: 6px;
}

.panels {
  display: grid;
  grid-template-rows: repeat(3, 1fr);
  gap: 6px;
  height: 60%;
}

.panel {
  background: var(--panel);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  transition: background 0.5s, border-color 0.5s;
}

/* ── HR + ZONE PANEL ── */
.panel-hr {
  background: color-mix(in srgb, var(--current-zone) 20%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--current-zone) 45%, transparent);
}

.zone-name-label {
  position: absolute;
  top: 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--current-zone);
  opacity: 0.9;
  transition: color 0.5s;
}

.hr-number {
  font-size: clamp(52px, 15dvh, 80px);
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.04em;
  color: #fff;
}

.hr-unit {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-top: 2px;
}

.zone-pips {
  display: flex;
  gap: 5px;
  position: absolute;
  bottom: 10px;
}

.zone-pip {
  width: 28px;
  height: 4px;
  border-radius: 2px;
  opacity: 0.2;
  transition: opacity 0.3s, transform 0.3s;
}

.zone-pip.active {
  opacity: 1;
  transform: scaleY(1.8);
}

/* ── CADENCE PANEL ── */
.panel-label {
  position: absolute;
  top: 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.cad-number {
  font-size: clamp(48px, 13dvh, 72px);
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--text);
}

.cad-unit {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 2px;
}

/* cadence zone bar */
.cad-bar {
  display: flex;
  gap: 3px;
  position: absolute;
  bottom: 10px;
  align-items: flex-end;
}

.cad-seg {
  height: 5px;
  border-radius: 2px;
  opacity: 0.2;
  transition: opacity 0.3s, background 0.3s, transform 0.3s;
}

.cad-seg.active {
  opacity: 1;
  transform: scaleY(1.8);
}

.cad-seg-wide { width: 36px; }
.cad-seg-narrow { width: 22px; }

/* ── TIMER PANEL ── */
.timer-number {
  font-size: clamp(42px, 11dvh, 64px);
  font-weight: 300;
  line-height: 1;
  letter-spacing: 0.02em;
  color: var(--text);
}

.phase-info {
  position: absolute;
  bottom: 10px;
  text-align: center;
  width: 100%;
  padding: 0 12px;
}

.phase-current {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 1px;
}

.phase-next {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.06em;
}

/* ── WORKOUT PICKER OVERLAY ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 400;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
}

.overlay.show { display: flex; }

.sheet {
  background: var(--panel);
  border-radius: var(--radius-lg) var(--radius-lg) var(--radius-md) var(--radius-md);
  width: 100%;
  max-width: 480px;
  max-height: 85dvh;
  overflow-y: auto;
  padding: 20px 16px 32px;
}

.sheet-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.sheet-sub {
  font-size: 13px;
  color: var(--text-sec);
  margin-bottom: 20px;
}

.workout-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.workout-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}

.workout-item:active { background: var(--border); }
.workout-item.selected { border-color: var(--accent); }

.workout-item-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
}

.workout-item-meta {
  font-size: 12px;
  color: var(--text-sec);
}

/* Duration picker for Zone 2 ride */
.duration-picker {
  display: none;
  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 0 4px;
}

.duration-picker.show { display: flex; }

.dur-btn {
  flex: 1;
  min-width: calc(33% - 6px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-sec);
  font-size: 13px;
  font-weight: 600;
  padding: 10px 4px;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}

.dur-btn.selected { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

.sheet-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

.sheet-actions .btn { flex: 1; padding: 13px; font-size: 14px; }

/* ── BLE WARNING ── */
.ble-warning {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 32px;
}
.ble-warning.show { display: flex; }
.ble-box {
  background: var(--panel);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  max-width: 320px;
  text-align: center;
}
.ble-box h2 { font-size: 17px; margin-bottom: 10px; color: var(--z4); }
.ble-box p { font-size: 13px; color: var(--text-sec); line-height: 1.6; margin-bottom: 20px; }

/* ── BOTTOM SPACER (so panels don't crowd edge) ── */
.bottom-spacer { flex: 1; }

/* Workout active banner */
.workout-banner {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  margin-top: 6px;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.workout-banner.show { display: flex; }
.workout-banner-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.workout-banner-detail {
  font-size: 11px;
  color: var(--text-sec);
}
.workout-end-btn {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="ble-warning" id="bleWarning">
  <div class="ble-box">
    <h2>Bluetooth unavailable</h2>
    <p>This app requires Web Bluetooth. Open it in Chrome on Android with Bluetooth enabled.</p>
    <button class="btn btn-secondary" onclick="document.getElementById('bleWarning').classList.remove('show')">OK</button>
  </div>
</div>

<!-- Workout Picker Overlay -->
<div class="overlay" id="workoutOverlay">
  <div class="sheet">
    <div class="sheet-title">Select Workout</div>
    <div class="sheet-sub">Choose a structured session or ride free</div>
    <div class="workout-list" id="workoutList"></div>
    <div class="duration-picker" id="durationPicker">
      <div class="dur-btn" onclick="selectDuration(30)">30 min</div>
      <div class="dur-btn" onclick="selectDuration(35)">35 min</div>
      <div class="dur-btn" onclick="selectDuration(40)">40 min</div>
      <div class="dur-btn" onclick="selectDuration(45)">45 min</div>
      <div class="dur-btn" onclick="selectDuration(50)">50 min</div>
      <div class="dur-btn" onclick="selectDuration(55)">55 min</div>
      <div class="dur-btn" onclick="selectDuration(60)">60 min</div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeWorkoutPicker()">Cancel</button>
      <button class="btn btn-primary" id="startWorkoutBtn" onclick="startSelectedWorkout()" disabled>Start</button>
    </div>
  </div>
</div>

<!-- Top bar: row 1 = controls, row 2 = sensors -->
<div class="top-bar">
  <div class="top-row">
    <a href="index.html" class="back-btn" title="Home">⌂</a>
    <button class="btn btn-secondary" id="timerStartBtn" onclick="toggleTimer()">Start</button>
    <button class="btn btn-ghost" onclick="resetAll()">Reset</button>
    <button class="btn btn-secondary" id="screenBtn" onclick="toggleScreenWake()">Screen On</button>
  </div>
  <div class="top-row">
    <button class="btn btn-secondary" id="hrBtn" onclick="connectHR()" style="flex:1">
      <span class="status-dot" id="hrDot"></span>Forerunner 245
    </button>
    <button class="btn btn-secondary" id="cadBtn" onclick="connectCadence()" style="flex:1">
      <span class="status-dot" id="cadDot"></span>Cadence
    </button>
    <button class="btn btn-secondary" onclick="openWorkoutPicker()" style="flex:0.7;font-size:11px;">Workout</button>
  </div>
</div>

<!-- Panels wrap -->
<div class="panels-wrap">
  <div class="panels">

    <!-- HR + Zone -->
    <div class="panel panel-hr" id="hrPanel">
      <span class="zone-name-label" id="zoneLabel">-- --</span>
      <div class="hr-number" id="hrValue">--</div>
      <div class="hr-unit">bpm</div>
      <div class="zone-pips">
        <div class="zone-pip" id="pip1" style="background:var(--z1)"></div>
        <div class="zone-pip" id="pip2" style="background:var(--z2)"></div>
        <div class="zone-pip" id="pip3" style="background:var(--z3)"></div>
        <div class="zone-pip" id="pip4" style="background:var(--z4)"></div>
        <div class="zone-pip" id="pip5" style="background:var(--z5)"></div>
      </div>
    </div>

    <!-- Cadence -->
    <div class="panel panel-cad">
      <span class="panel-label">Cadence</span>
      <div class="cad-number" id="cadValue">--</div>
      <div class="cad-unit">rpm</div>
      <div class="cad-bar" id="cadBar">
        <div class="cad-seg cad-seg-wide"  id="cad-seg-1" style="background:#f44336"></div>
        <div class="cad-seg cad-seg-narrow" id="cad-seg-2" style="background:#ff9800"></div>
        <div class="cad-seg cad-seg-wide"  id="cad-seg-3" style="background:var(--accent)"></div>
        <div class="cad-seg cad-seg-narrow" id="cad-seg-4" style="background:#ff9800"></div>
        <div class="cad-seg cad-seg-wide"  id="cad-seg-5" style="background:#f44336"></div>
      </div>
    </div>

    <!-- Timer -->
    <div class="panel panel-timer">
      <span class="panel-label" id="timerLabel">Elapsed</span>
      <div class="timer-number" id="timerValue">0:00</div>
      <div class="phase-info" id="phaseInfo" style="display:none">
        <div class="phase-current" id="phaseCurrent"></div>
        <div class="phase-next" id="phaseNext"></div>
      </div>
    </div>

  </div>

  <!-- Workout active banner -->
  <div class="workout-banner" id="workoutBanner">
    <div>
      <div class="workout-banner-name" id="bannerName"></div>
      <div class="workout-banner-detail" id="bannerDetail"></div>
    </div>
    <button class="workout-end-btn" onclick="endWorkout()">End</button>
  </div>

  <div class="bottom-spacer"></div>
</div>

<script>
// ── ZONES ──
const ZONES = [
  { num:1, min:30,  max:105, label:'Zone 1', color:'#6b6b6b' },
  { num:2, min:106, max:123, label:'Zone 2', color:'#4a90d9' },
  { num:3, min:124, max:141, label:'Zone 3', color:'#4caf50' },
  { num:4, min:142, max:158, label:'Zone 4', color:'#ff9800' },
  { num:5, min:159, max:220, label:'Zone 5', color:'#f44336' },
];

function getZone(hr) { return ZONES.find(z => hr >= z.min && hr <= z.max) || null; }

let currentZone = null;
let currentHR = 0;

function updateHR(hr) {
  currentHR = hr;
  document.getElementById('hrValue').textContent = hr;
  const zone = getZone(hr);
  if (!zone || currentZone?.num === zone.num) return;
  currentZone = zone;
  document.documentElement.style.setProperty('--current-zone', zone.color);
  document.getElementById('zoneLabel').textContent = zone.label;
  for (let i=1;i<=5;i++) document.getElementById(`pip${i}`).classList.toggle('active', i===zone.num);
}

// ── CADENCE ZONES ──
let cadMin = 80, cadMax = 90;

function setCadenceZone(min, max) {
  cadMin = min; cadMax = max;
  if (currentCad > 0) updateCadenceBar(currentCad);
}

let currentCad = 0;

function updateCadBar(rpm) {
  // Segments: 1=red-low, 2=amber-low, 3=teal-target, 4=amber-high, 5=red-high
  const bufLow  = cadMin - 10;
  const bufHigh = cadMax + 10;
  let active = 0;
  if (rpm < bufLow)       active = 1;
  else if (rpm < cadMin)  active = 2;
  else if (rpm <= cadMax) active = 3;
  else if (rpm <= bufHigh)active = 4;
  else                    active = 5;
  for (let i=1;i<=5;i++) document.getElementById(`cad-seg-${i}`).classList.toggle('active', i===active);
}

function updateCadence(rpm) {
  currentCad = rpm;
  document.getElementById('cadValue').textContent = rpm;
  updateCadBar(rpm);
}

// ── TIMER ──
let timerInterval = null;
let timerRunning = false;
let elapsed = 0;

function toggleTimer() {
  const btn = document.getElementById('timerStartBtn');
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    btn.textContent = 'Resume';
    btn.classList.remove('active');
  } else {
    timerRunning = true;
    btn.textContent = 'Pause';
    btn.classList.add('active');
    timerInterval = setInterval(() => {
      elapsed++;
      updateTimerDisplay();
      if (activeWorkout) tickWorkout();
    }, 1000);
  }
}

function updateTimerDisplay() {
  const h = Math.floor(elapsed/3600);
  const m = Math.floor((elapsed%3600)/60);
  const s = elapsed%60;
  document.getElementById('timerValue').textContent = h>0
    ? `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`
    : `${m}:${s.toString().padStart(2,'0')}`;
}

function resetAll() {
  clearInterval(timerInterval);
  timerRunning = false;
  elapsed = 0;
  document.getElementById('timerValue').textContent = '0:00';
  document.getElementById('timerStartBtn').textContent = 'Start';
  document.getElementById('timerStartBtn').classList.remove('active');
  endWorkout();
}

// ── WORKOUT ENGINE ──
let workouts = [];
let activeWorkout = null;
let currentPhaseIdx = 0;
let phaseElapsed = 0;
let selectedWorkout = null;
let selectedDuration = null;

async function loadWorkouts() {
  try {
    const r = await fetch('workouts.json');
    const data = await r.json();
    workouts = data.workouts;
    // Set default cadence from file
    if (data.defaults) setCadenceZone(data.defaults.cadence_min, data.defaults.cadence_max);
  } catch(e) {
    console.log('Could not load workouts.json:', e);
    workouts = [];
  }
}

function openWorkoutPicker() {
  const list = document.getElementById('workoutList');
  list.innerHTML = '';
  workouts.forEach((w, i) => {
    const totalSecs = w.phases.reduce((a,p) => a+p.duration, 0);
    const mins = Math.round(totalSecs/60);
    const div = document.createElement('div');
    div.className = 'workout-item';
    div.innerHTML = `
      <div class="workout-item-name">${w.name}</div>
      <div class="workout-item-meta">${w.phases.length} phase${w.phases.length>1?'s':''}${w.type==='timed'?' · set duration':` · ${mins} min`}</div>
    `;
    div.onclick = () => selectWorkout(i, div, w);
    list.appendChild(div);
  });
  document.getElementById('workoutOverlay').classList.add('show');
  selectedWorkout = null;
  selectedDuration = null;
  document.getElementById('startWorkoutBtn').disabled = true;
  document.getElementById('durationPicker').classList.remove('show');
}

function selectWorkout(idx, el, workout) {
  document.querySelectorAll('.workout-item').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  selectedWorkout = workout;
  selectedDuration = null;

  const picker = document.getElementById('durationPicker');
  if (workout.type === 'timed') {
    picker.classList.add('show');
    document.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('startWorkoutBtn').disabled = true;
  } else {
    picker.classList.remove('show');
    document.getElementById('startWorkoutBtn').disabled = false;
  }
}

function selectDuration(mins) {
  selectedDuration = mins * 60;
  document.querySelectorAll('.dur-btn').forEach(b => {
    b.classList.toggle('selected', b.textContent === `${mins} min`);
  });
  document.getElementById('startWorkoutBtn').disabled = false;
}

function closeWorkoutPicker() {
  document.getElementById('workoutOverlay').classList.remove('show');
}

function startSelectedWorkout() {
  if (!selectedWorkout) return;
  const w = JSON.parse(JSON.stringify(selectedWorkout)); // deep copy
  if (w.type === 'timed' && selectedDuration) {
    w.phases[0].duration = selectedDuration;
  }
  closeWorkoutPicker();
  beginWorkout(w);
}

function beginWorkout(w) {
  activeWorkout = w;
  currentPhaseIdx = 0;
  phaseElapsed = 0;
  // Reset timer
  clearInterval(timerInterval);
  timerRunning = false;
  elapsed = 0;
  document.getElementById('timerValue').textContent = '0:00';
  document.getElementById('timerStartBtn').textContent = 'Start';
  document.getElementById('timerStartBtn').classList.remove('active');

  updatePhaseDisplay();

  // Show banner
  const totalMins = Math.round(w.phases.reduce((a,p)=>a+p.duration,0)/60);
  document.getElementById('bannerName').textContent = w.name;
  document.getElementById('bannerDetail').textContent = `${w.phases.length} phases · ${totalMins} min`;
  document.getElementById('workoutBanner').classList.add('show');

  // Apply first phase cadence
  const phase = w.phases[0];
  if (phase.cadence_min !== undefined) setCadenceZone(phase.cadence_min, phase.cadence_max);
}

function updatePhaseDisplay() {
  if (!activeWorkout) return;
  const phase = activeWorkout.phases[currentPhaseIdx];
  const remaining = phase.duration - phaseElapsed;
  const nextPhase = activeWorkout.phases[currentPhaseIdx+1];

  document.getElementById('phaseInfo').style.display = 'block';
  document.getElementById('timerLabel').style.display = 'none';

  const m = Math.floor(remaining/60);
  const s = remaining%60;
  document.getElementById('phaseCurrent').textContent =
    `${phase.name} · ${m}:${s.toString().padStart(2,'0')} left`;
  document.getElementById('phaseNext').textContent = nextPhase
    ? `Next: ${nextPhase.name}`
    : 'Final phase';

  // Highlight target zone on HR panel
  const targetZoneNum = phase.zone;
  document.documentElement.style.setProperty('--phase-zone', ZONES[targetZoneNum-1]?.color || 'transparent');
}

function tickWorkout() {
  phaseElapsed++;
  const phase = activeWorkout.phases[currentPhaseIdx];

  if (phaseElapsed >= phase.duration) {
    // Move to next phase
    currentPhaseIdx++;
    phaseElapsed = 0;

    if (currentPhaseIdx >= activeWorkout.phases.length) {
      // Workout complete
      beep(3);
      endWorkout();
      return;
    }

    beep(1);
    const nextPhase = activeWorkout.phases[currentPhaseIdx];
    if (nextPhase.cadence_min !== undefined) setCadenceZone(nextPhase.cadence_min, nextPhase.cadence_max);
  }

  updatePhaseDisplay();
}

function endWorkout() {
  activeWorkout = null;
  currentPhaseIdx = 0;
  phaseElapsed = 0;
  document.getElementById('workoutBanner').classList.remove('show');
  document.getElementById('phaseInfo').style.display = 'none';
  document.getElementById('timerLabel').style.display = '';
}

// ── AUDIO BEEP ──
function beep(count=1) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    let t = ctx.currentTime;
    for (let i=0;i<count;i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, t);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.4);
      osc.start(t); osc.stop(t+0.4);
      t += 0.5;
    }
  } catch(e) {}
}

// ── BLE: HR ──
let hrDevice = null;

async function connectHR() {
  if (!navigator.bluetooth) { document.getElementById('bleWarning').classList.add('show'); return; }
  const btn = document.getElementById('hrBtn');
  const dot = document.getElementById('hrDot');
  if (hrDevice) {
    hrDevice.gatt.disconnect(); hrDevice = null;
    btn.classList.remove('active'); dot.classList.remove('connected');
    btn.innerHTML = '<span class="status-dot" id="hrDot"></span>Forerunner 245';
    document.getElementById('hrValue').textContent = '--';
    currentZone = null;
    document.documentElement.style.setProperty('--current-zone','#6b6b6b');
    document.getElementById('zoneLabel').textContent = '-- --';
    return;
  }
  try {
    btn.textContent = 'Scanning…';
    hrDevice = await navigator.bluetooth.requestDevice({
      filters:[{services:['heart_rate']}],
      optionalServices:['heart_rate']
    });
    hrDevice.addEventListener('gattserverdisconnected', () => {
      btn.classList.remove('active'); document.getElementById('hrDot').classList.remove('connected');
      btn.innerHTML = '<span class="status-dot" id="hrDot"></span>Forerunner 245';
      document.getElementById('hrValue').textContent = '--'; hrDevice = null;
    });
    const server = await hrDevice.gatt.connect();
    const svc = await server.getPrimaryService('heart_rate');
    const char = await svc.getCharacteristic('heart_rate_measurement');
    char.addEventListener('characteristicvaluechanged', e => {
      const flags = e.target.value.getUint8(0);
      const hr = flags&0x01 ? e.target.value.getUint16(1,true) : e.target.value.getUint8(1);
      updateHR(hr);
    });
    await char.startNotifications();
    btn.classList.add('active'); dot.classList.add('connected');
    btn.innerHTML = `<span class="status-dot connected" id="hrDot"></span>${hrDevice.name||'Forerunner 245'}`;
  } catch(e) {
    hrDevice = null;
    btn.innerHTML = '<span class="status-dot" id="hrDot"></span>Forerunner 245';
    if (e.name!=='NotFoundError') console.error('HR:',e);
  }
}

// ── BLE: CADENCE ──
let cadDevice = null, lastCrankRevs = null, lastCrankTime = null;

async function connectCadence() {
  if (!navigator.bluetooth) { document.getElementById('bleWarning').classList.add('show'); return; }
  const btn = document.getElementById('cadBtn');
  const dot = document.getElementById('cadDot');
  if (cadDevice) {
    cadDevice.gatt.disconnect(); cadDevice = null;
    btn.classList.remove('active'); dot.classList.remove('connected');
    btn.innerHTML = '<span class="status-dot" id="cadDot"></span>Cadence';
    document.getElementById('cadValue').textContent = '--';
    lastCrankRevs = null; lastCrankTime = null; return;
  }
  try {
    btn.textContent = 'Scanning…';
    cadDevice = await navigator.bluetooth.requestDevice({
      filters:[{services:['cycling_speed_and_cadence']}],
      optionalServices:['cycling_speed_and_cadence']
    });
    cadDevice.addEventListener('gattserverdisconnected', () => {
      btn.classList.remove('active'); document.getElementById('cadDot').classList.remove('connected');
      btn.innerHTML = '<span class="status-dot" id="cadDot"></span>Cadence';
      document.getElementById('cadValue').textContent = '--'; cadDevice = null;
    });
    const server = await cadDevice.gatt.connect();
    const svc = await server.getPrimaryService('cycling_speed_and_cadence');
    const char = await svc.getCharacteristic('csc_measurement');
    char.addEventListener('characteristicvaluechanged', e => {
      const data = e.target.value;
      const flags = data.getUint8(0);
      if (flags&0x02) {
        const revs = data.getUint16(1,true);
        const time = data.getUint16(3,true);
        if (lastCrankRevs!==null) {
          let rd = revs-lastCrankRevs; if(rd<0) rd+=65536;
          let td = time-lastCrankTime; if(td<0) td+=65536;
          if (td>0&&rd>=0) {
            const rpm = Math.round((rd/td)*1024*60);
            if (rpm>=0&&rpm<200) updateCadence(rpm);
          }
        }
        lastCrankRevs=revs; lastCrankTime=time;
      }
    });
    await char.startNotifications();
    btn.classList.add('active'); dot.classList.add('connected');
    btn.innerHTML = `<span class="status-dot connected" id="cadDot"></span>${cadDevice.name||'Cadence'}`;
  } catch(e) {
    cadDevice = null;
    btn.innerHTML = '<span class="status-dot" id="cadDot"></span>Cadence';
    if (e.name!=='NotFoundError') console.error('CAD:',e);
  }
}

// ── SCREEN WAKE ──
let wakeLock = null;
async function toggleScreenWake() {
  const btn = document.getElementById('screenBtn');
  if (wakeLock) {
    try { await wakeLock.release(); } catch(e) {}
    wakeLock = null; btn.textContent='Screen On'; btn.classList.remove('active');
  } else {
    if (!('wakeLock' in navigator)) { btn.textContent='Not supported'; setTimeout(()=>btn.textContent='Screen On',2500); return; }
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      btn.textContent='● Screen On'; btn.classList.add('active');
      wakeLock.addEventListener('release', ()=>{ wakeLock=null; btn.textContent='Screen On'; btn.classList.remove('active'); });
    } catch(e) { btn.textContent='Tap again'; btn.classList.remove('active'); setTimeout(()=>btn.textContent='Screen On',2500); }
  }
}

// ── INIT ──
loadWorkouts();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
